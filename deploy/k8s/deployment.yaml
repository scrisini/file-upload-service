apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-upload-service
spec:
  replicas: 3                       # one per availability zone
  selector:
    matchLabels:
      app.kubernetes.io/name: file-upload-service
  strategy:
    # One pod at a time, never below the running count, so the others keep full capacity meanwhile.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: file-upload-service
    spec:
      serviceAccountName: file-upload-service
      # preStop (20s) + one shutdown phase (30s, spring.lifecycle.timeout-per-shutdown-phase), with margin
      terminationGracePeriodSeconds: 75
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: file-upload-service
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: file-upload-service
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: file-upload-service
          image: file-upload-service
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: file-upload-service-env
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              # The image sizes the heap from this: limit minus about 650 MiB (thread stacks, code
              # cache, metaspace). Below 1 GiB the heap is usually too small to start.
              memory: 1536Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36      # 3 minutes
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              # Keep serving while the endpoint removal reaches the ALB (target-type ip), so no new
              # request lands on a pod that has stopped accepting. The image has no shell, so this
              # is the built-in sleep action (Kubernetes 1.30+), not "exec sleep".
              sleep:
                seconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # The service writes no files: uploads stream to S3 and multipart parsing is off. Tomcat
        # still needs an (empty) base directory and the JVM its perf-data file, so /tmp is a small
        # in-memory volume rather than disk: no node storage is assumed, and nothing survives the pod.
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
