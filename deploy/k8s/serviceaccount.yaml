apiVersion: v1
kind: ServiceAccount
metadata:
  name: file-upload-service
  annotations:
    # IAM role for SSM Parameter Store reads (IRSA; or use an EKS Pod Identity association instead).
    # Its token is also how the service logs in to Vault (FILE_UPLOAD_SERVICE_VAULT_AUTH=kubernetes).
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/file-upload-service   # CHANGE
