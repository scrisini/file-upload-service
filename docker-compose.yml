# Local stand-ins for the AWS services file-upload-service uses (scripts/dev.sh infra). All are
# free emulators; none needs an account. GuardDuty and EventBridge have no emulator: the service's
# own simulator (FILE_UPLOAD_SERVICE_SCAN_SIMULATOR, on with scripts/dev.sh run) plays their part.
# Data lives only in the containers: `scripts/dev.sh reset` (or a restart) empties them.
#
# The `app` service is file-upload-service itself, in the image `scripts/dev.sh docker` builds the
# way production does (Cloud Native Buildpacks). It's in the `app` profile, so `docker compose up`
# and `scripts/dev.sh infra` start only the emulators.
services:
  app:
    profiles: [app]
    image: file-upload-service:dev
    depends_on:
      s3: {condition: service_healthy}
      sqs: {condition: service_healthy}
      dynamodb: {condition: service_healthy}
    ports:
      # SERVER_PORT is the port on this machine; inside the container the app is on 8080
      - "${SERVER_PORT:-8080}:8080"
    environment:
      FILE_UPLOAD_SERVICE_AWS_REGION: us-east-1
      # the app reaches the emulators by service name...
      FILE_UPLOAD_SERVICE_S3_ENDPOINT: http://s3:9090
      FILE_UPLOAD_SERVICE_SQS_ENDPOINT: http://sqs:9324
      FILE_UPLOAD_SERVICE_DYNAMODB_ENDPOINT: http://dynamodb:8000
      FILE_UPLOAD_SERVICE_SCAN_QUEUE_URL: http://sqs:9324/000000000000/file-upload-scan-events
      # ...but presigned URLs go to browsers on this machine
      FILE_UPLOAD_SERVICE_S3_PRESIGN_ENDPOINT: http://localhost:9099
      FILE_UPLOAD_SERVICE_SCAN_SIMULATOR: "true"
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      # the image's launcher prints a memory report to stdout at exit (docs/deployment.md)
      BPL_JAVA_NMT_ENABLED: "false"
    # as on Kubernetes: nothing to write but a small in-memory /tmp for Tomcat and the JVM
    read_only: true
    tmpfs:
      - /tmp:size=16m
    deploy:
      resources:
        limits:
          memory: 1536m

  s3:
    # S3 API on :9099 (http). Buckets created at startup.
    image: adobe/s3mock:4.11.0
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: file-upload-quarantine,file-upload-clean
    ports:
      - "9099:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/file-upload-quarantine"]
      interval: 3s
      timeout: 3s
      retries: 20

  sqs:
    # SQS API on :9324; queues from config/local/elasticmq.conf
    image: softwaremill/elasticmq-native:1.7.1
    volumes:
      - ./config/local/elasticmq.conf:/opt/elasticmq.conf:ro
    ports:
      - "9324:9324"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9324/?Action=ListQueues"]
      interval: 3s
      timeout: 3s
      retries: 20

  dynamodb:
    # DynamoDB API on :8000; scripts/dev.sh creates the table from deploy/aws/dynamodb-table.json
    image: amazon/dynamodb-local:3.3.0
    command: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb"]
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null localhost:8000 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
