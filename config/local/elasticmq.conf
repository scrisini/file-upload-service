# Local SQS (ElasticMQ) for scripts/dev.sh: the scan queue and its dead-letter queue, as
# deploy/aws/ creates them in AWS. Queue URL: http://localhost:9324/000000000000/file-upload-scan-events
include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

aws {
  region = us-east-1
  accountId = 000000000000
}

queues {
  file-upload-scan-events {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "file-upload-scan-events-dlq"
      maxReceiveCount = 5
    }
  }
  file-upload-scan-events-dlq {}
}
